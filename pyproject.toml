[project]
name = "paperforge"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.135.1",
    "jinja2>=3.1.6",
    "weasyprint>=66.0",
    "pydantic>=2.12.5",
    "pyhanko>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.12.5",
]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing --cov-report=html -v"
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
src = ["app"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I"]
